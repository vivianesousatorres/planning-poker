services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: planning-poker-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: npm run dev -- --host 0.0.0.0

    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: planning-poker-backend

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    command: npm run dev